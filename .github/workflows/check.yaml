name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  # update.yaml pushes with GITHUB_TOKEN, which never triggers this workflow,
  # so rebuild main hourly to keep the cache warm. A run with nothing new only
  # substitutes from the cache.
  schedule:
    - cron: "45 * * * *"

jobs:
  fmt-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Flake check
        run: nix flake check

  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          - os: ubuntu-24.04-arm
            system: aarch64-linux
          - os: macos-latest
            system: aarch64-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: nkl-nix-config
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name == 'pull_request' }}

      - name: Build pi
        run: nix build .#pi

      - name: Test pi
        env:
          PI_OFFLINE: "1"
        run: |
          ./result/bin/pi --version
          ./result/bin/pi --help
